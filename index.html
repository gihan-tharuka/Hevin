<main class="flex-1 h-screen overflow-y-auto sm:ml-72">

<div class="flex items-center justify-center px-6 sm:px-10">

    <div class="relative">
     <img alt="Portrait of a smiling young man with curly hair in black and white" class="rounded-full border-8 border-gray-400 w-40 h-40 sm:w-52 sm:h-52" src="img/hevin.jpg"/>
     <div class="absolute top-0 right-0 w-6 h-6 border-2 border-gray-700 rounded-full flex items-center justify-center">

     <h2 class="font-poppins font-extrabold text-3xl sm:text-4xl text-black mb-4 leading-tight" data-i18n="hero_name">
      Hevin Randika
     </h2>
     <p class="text-gray-500 mb-8 max-w-md leading-relaxed mx-auto sm:mx-0" data-i18n="hero_desc">
    I am a passionate videographer dedicated to capturing moments and telling compelling stories through film.
     </p>
     <div class="flex justify-center sm:justify-start items-center space-x-4 text-black text-md">
      <a aria-label="YouTube" class="hover:text-gray-700" href="https://www.youtube.com/@hevinperry">
       <i class="fab fa-youtube"></i>
      </a>
      <a aria-label="Instagram" class="hover:text-gray-700" href="https://www.instagram.com/hevinperry/">
       <i class="fab fa-instagram"></i>
      </a>
      <a aria-label="LinkedIn" class="hover:text-gray-700" href="https://www.linkedin.com/in/hevinperiyapperuma/">
       <i class="fab fa-linkedin-in"></i>

     </div>
     <button class="mt-6 bg-black text-white px-5 py-2 rounded-md font-semibold hover:bg-gray-800 transition" data-i18n="contact_me">Contact Me</button>

<script>
   const btn = document.getElementById('menu-btn');
    const menu = document.getElementById('menu');
    const icon = document.getElementById('menu-icon');

    btn.addEventListener('click', () => {
      menu.classList.toggle('hidden');
      menu.classList.toggle('flex');
      if(icon.classList.contains('fa-bars')){
        icon.classList.remove('fa-bars');
        icon.classList.add('fa-times');
      } else {
        icon.classList.remove('fa-times');
        icon.classList.add('fa-bars');
      }
    });

    const translations = {
      nav_home: { en: 'Home', jp: 'ホーム' },
      nav_about: { en: 'About', jp: 'について' },
      nav_service: { en: 'Service', jp: 'サービス' },
      nav_portfolio: { en: 'Portfolio', jp: 'ポートフォリオ' },
      nav_news: { en: 'News', jp: 'ニュース' },
      nav_contact: { en: 'Contact', jp: 'お問い合わせ' },
      hero_name: { en: 'Hevin Randika', jp: 'ヘビン・ランディカ' },
      hero_desc: { en: 'I am a passionate videographer dedicated to capturing moments and telling compelling stories through film.', jp: '私は映画を通じて瞬間を捉え、感動的なストーリーを伝える情熱的なビデオグラファーです。' },
      contact_me: { en: 'Contact Me', jp: 'お問い合わせ' },
      about_title: { en: 'About Me', jp: '私について' },
      about_desc1: { en: 'Hi, I\'m Hevin Randika, a dedicated videographer and photographer passionate about capturing life\'s most meaningful moments. With years of experience in visual storytelling, I specialize in transforming ideas into compelling narratives that resonate with audiences. From promotional videos to documentaries, I believe in the power of film to connect people and share authentic stories.', jp: 'こんにちは、私はヘビン・ランディカです。ビデオグラファーとフォトグラファーとして、人生で最も意味のある瞬間を捉えることに情熱を注いでいます。ビジュアルストーリーテリングの豊富な経験を持ち、オーディエンスに響く魅力的な物語にアイデアを変えることを専門としています。プロモーショナルビデオからドキュメンタリーまで、映画の力が人々をつなぎ、本物の物語を共有するという信念を持っています。' },
      about_desc2: { en: 'My journey into videography and photography began with a love for creativity and technology. I\'ve worked on diverse projects, from corporate promotions to personal documentaries, always striving to blend artistic vision with technical excellence. When not behind the camera, you\'ll find me exploring new editing techniques and staying current with industry trends.', jp: 'ビデオグラファーとフォトグラフィーの旅は、創造性と技術への情熱から始まりました。私は企業プロモーションから個人ドキュメンタリーまで、多様なプロジェクトに取り組んでいます。常に芸術的なビジョンと技術的な卓越性を組み合わせるよう努めています。カメラの後ろにいないとき、私は新しい編集テクニックを探求し、業界トレンドを最新の状態に保っています。' },
      contact_category: { en: 'CONTACT', jp: 'お問い合わせ' },
      contact_title: { en: 'Get in Touch', jp: 'コンタクト' },
      name_label: { en: 'Name', jp: '名前' },
      email_label: { en: 'Email', jp: 'メール' },
      message_label: { en: 'Message', jp: 'メッセージ' },
      send_message: { en: 'Send Message', jp: 'メッセージを送信' },
      placeholder_name: { en: 'Your name', jp: 'あなたの名前' },
      placeholder_email: { en: 'you@example.com', jp: 'you@example.com' },
      placeholder_message: { en: 'Write your message here', jp: 'ここにメッセージを書いてください' },
      email_label_small: { en: 'Email:', jp: 'メール:' },
      mobile_label: { en: 'Mobile:', jp: 'モバイル:' },
      servi_prom: { en: 'Promotional Video Production', jp: 'プロモーショナルビデオ制作' },
      servi_prom_desc: { en: 'Elevate your brand with our expertly crafted promotional videos. We blend creativity and strategy to deliver compelling visual stories. Let us help you engage your audience and boost your business presence.', jp: '専門的に作られたプロモーショナルビデオであなたのブランドを向上させましょう。創造性と戦略を組み合わせ、魅力的で変換を促進する視覚的なストーリーを提供します。ビジネスが永遠の印象を与えるのに最適です。' },
      servi_pod: { en: 'Pod Cast', jp: 'ポッドキャスト' },
      servi_pod_desc: { en: 'Tune in to our engaging podcasts featuring insightful conversations and inspiring stories. We cover a wide range of topics to keep you informed and entertained. Join our community and be part of the dialogue.', jp: '洞察力のある会話とインスピレーションを与えるストーリーを特徴とする魅力的なポッドキャストにチューニングしましょう。私たちはあなたを情報提供しエンターテイメントする幅広いトピックをカバーします。私たちのコミュニティに参加し対話の一部になります。' },
      servi_doc: { en: 'Documentary Production', jp: 'ドキュメンタリー制作' },
      servi_doc_desc: { en: 'Experience powerful storytelling through our documentary productions. We capture real-life events and perspectives with authenticity and depth. Discover new viewpoints and broaden your understanding with every film.', jp: '私たちのドキュメンタリー制作を通じて強力なストーリーテリングを体験してください。私たちは本物と深みを持って実生活のイベントと視点を見つめます。新しい視点を発見し、すべての映画で理解を広げてください。' },
      servi_social: { en: 'Social Media Content Production', jp: 'ソーシャルメディアコンテンツ制作' },
      servi_social_desc: { en: 'Boost your online presence with our creative social media content. We design eye-catching visuals and videos tailored for every platform. Grow your audience and make a lasting impression in the digital world.', jp: '創造的なソーシャルメディアコンテンツであなたのオンラインプレゼンスを向上させましょう。Instagram、YouTube、TikTokなどのプラットフォームに合わせた目を引くキャラクターをデザインします。オーディエンスを成長させ、デジタル世界で永遠の印象を与えます。' },
      instagram_note: { en: 'Instagram Reel preview is not available for direct embedding. <a href="https://www.instagram.com/reel/DL4iyc8STXg/?igsh=Y3BjZWt6ems5dG5u" target="_blank" class="text-blue-600 underline">Watch on Instagram</a>', jp: 'Instagram Reelのプレビューは直接埋め込みできません。 <a href="https://www.instagram.com/reel/DL4iyc8STXg/?igsh=Y3BjZWt6ems5dG5u" target="_blank" class="text-blue-600 underline">Instagramで視聴</a>' },
      servi_photo: { en: 'Photography Services', jp: '写真サービス' },
      servi_photo_desc: { en: 'Professional photography for portraits, events, and promotional content. I specialize in capturing authentic moments that tell your story visually, from studio shoots to on-location sessions.', jp: 'ポートレート、イベント、プロモーショナルコンテンツのためのプロフェッショナル写真。スタジオ撮影からオンサイトセッションまで、視覚的にあなたの物語を伝える本物の瞬間を捉えることを専門としています。' },
      servi_edit: { en: 'Video Editing & Post-Production', jp: 'ビデオ編集とポストプロダクション' },
      servi_edit_desc: { en: 'Transform raw footage into polished masterpieces with professional editing services. Including color grading, sound design, and special effects to bring your vision to life with technical precision.', jp: 'プロフェッショナルな編集サービスで生の映像を磨かれた傑作に変えます。色のグレーディング、音響設計、特殊効果など、あなたのビジョンを技術的な精密さで実現します。' }
    };

    function loadLang() {
      const lang = localStorage.getItem('lang') || 'en';
      setLang(lang);
    }

    function setLang(lang) {
      localStorage.setItem('lang', lang);
      const elements = document.querySelectorAll('[data-i18n]');
      elements.forEach(el => {
        const key = el.dataset.i18n;
        if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
          el.placeholder = translations[key][lang];
        } else {
          el.innerHTML = translations[key][lang];
        }
      });
      document.getElementById('lang-toggle').innerText = lang === 'en' ? 'EN / JP' : 'JP / EN';
    }

    function switchLang() {
      const current = localStorage.getItem('lang') || 'en';
      setLang(current === 'en' ? 'jp' : 'en');
    }

    document.getElementById('lang-toggle').addEventListener('click', switchLang);
    document.addEventListener('DOMContentLoaded', loadLang);

    // Portfolio Tabs
    const tabButtons = document.querySelectorAll('.tab-button');
    const sections = document.querySelectorAll('.category-section');

    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        const category = button.getAttribute('data-category');
        tabButtons.forEach(btn => {
          btn.classList.remove('active');
          btn.classList.add('bg-gray-200', 'text-gray-700');
          btn.classList.remove('bg-black', 'text-white');
        });
        button.classList.add('active');
        button.classList.remove('bg-gray-200', 'text-gray-700');
        button.classList.add('bg-black', 'text-white');

        sections.forEach(section => section.style.display = 'none');
        if (category === 'all') {
          sections.forEach(section => section.style.display = 'block');
        } else {
          const selectedSection = document.querySelector(`.category-section.${category}`);
          if (selectedSection) selectedSection.style.display = 'block';
        }
      });
    });

    // View All Reels Toggle
    const viewAllBtn = document.getElementById('view-all-reels-btn');
    if (viewAllBtn) {
      viewAllBtn.addEventListener('click', function() {
        const hiddenReels = document.querySelector('.hidden-reels');
        if (hiddenReels.style.display === 'none' || hiddenReels.style.display === '') {
          hiddenReels.style.display = 'block';
          this.textContent = 'Show Less';
        } else {
          hiddenReels.style.display = 'none';
          this.textContent = 'View All Reels';
        }
      });
    }

    // View All Reels Toggle for Kings
    const viewAllKingsBtn = document.getElementById('view-all-kings-btn');
    if (viewAllKingsBtn) {
      viewAllKingsBtn.addEventListener('click', function() {
        const kingsGrid = viewAllKingsBtn.previousElementSibling;
        const kingsDivs = Array.from(kingsGrid.querySelectorAll('.bg-white'));
        const hiddenDivs = kingsDivs.slice(2);
        const isHidden = hiddenDivs[0].style.display === 'none' || hiddenDivs[0].style.display === '';
        hiddenDivs.forEach(div => div.style.display = isHidden ? 'block' : 'none');
        this.textContent = isHidden ? 'Show Less' : 'View All Reels';
      });
    }

    // View All Reels Toggle for Unbound
    const viewAllUnboundBtn = document.getElementById('view-all-unbound-btn');
    if (viewAllUnboundBtn) {
      viewAllUnboundBtn.addEventListener('click', function() {
        const unboundGrid = viewAllUnboundBtn.previousElementSibling;
        const unboundDivs = Array.from(unboundGrid.querySelectorAll('.bg-white'));
        const hiddenDivs = unboundDivs.slice(2);
        const isHidden = hiddenDivs[0].style.display === 'none' || hiddenDivs[0].style.display === '';
        hiddenDivs.forEach(div => div.style.display = isHidden ? 'block' : 'none');
        this.textContent = isHidden ? 'Show Less' : 'View All Reels';
      });
    }
  </script>

</body>
</html>
